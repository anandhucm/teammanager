<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Manager App Login</title>
</head>
<body>
        @if (isLoggedIn()){
            <header class="app-navbar-main">
                <div class="navbar-app-brand">
                    Team Manager App
                </div>

            <div class="navbar-user-container">
                <div class="navbar-user-info">
                    <span class="navbar-user-name">{{ memberData()?.firstName }}</span>
                    <img src="user-placeholder.jpg" alt="User Avatar" class="navbar-user-avatar">
                    <i class="navbar-dropdown-arrow">▼</i>
                </div>

                <div class="navbar-dropdown-menu"> 
                    <a href="/edit-profile" class="dropdown-menu-item profile-option">Edit Profile</a>
                    <div class="dropdown-menu-divider"></div>
                    <a (click)="logout()" class="dropdown-menu-item logout-option">Logout</a>
                </div>
            </div>
       </header>
    } @else {
           <div class="container">
               <div class="welcome-area">
                   <div class="welcome-content">
                       <h1>Welcome to the Team Manager App</h1>
                       <p>Access your projects, track team progress, and manage your tasks efficiently.</p>
                       <div class="abstract-graphics"></div>
                   </div>
                   <div class="footer">
                       Designed for <span>High-Performance Teams</span>
                   </div>
               </div>
            <div class="login-area">
                <div class="login-form-card">
                    <h2>MANAGER LOGIN</h2>
                    <form #loginForm="ngForm" (ngSubmit)="login()">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input [(ngModel)]="credentials.UserName" name="email" type="text" placeholder="Team ID or Email">
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i> 
                            <input [(ngModel)]="credentials.Password" name="password" type="password" placeholder="Secure Password">
                        </div>
                        
                        <div class="options">
                            <label class="remember-me">
                                <input type="checkbox" checked>
                                Remember Me
                            </label>
                            <a href="#" class="forgot-password">Forgot Password?</a>
                        </div>
                        <button type="submit" class="login-button">LOG IN</button>
                    </form>
                </div>
            </div>
        </div>
        }
</body>
</html>
